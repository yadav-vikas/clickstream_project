<!DOCTYPE html>
<html>
<head>
  <title>Signup Page</title>
  <script type="text/javascript">
    ;(function(p,l,o,w,i,n,g){if(!p[i]){p.GlobalSnowplowNamespace=p.GlobalSnowplowNamespace||[];
    p.GlobalSnowplowNamespace.push(i);p[i]=function(){(p[i].q=p[i].q||[]).push(arguments)
    };p[i].q=p[i].q||[];n=l.createElement(o);g=l.getElementsByTagName(o)[0];n.async=1;
    n.src=w;g.parentNode.insertBefore(n,g)}}(window,document,"script","../static/sp.js","snowplow"));
    window.snowplow('newTracker', 'sp', 'localhost:9090', {
      appId: 'flaskweb',
      platform: 'web',
      cookieDomain: null
    });

    window.snowplow('trackPageView');

    function trackSignup() {
      window.snowplow('trackSelfDescribingEvent', {
        schema: "iglu:com.example/signup_event/jsonschema/1-0-0",
        data: {
          formId: "signup-form",
          formType: "basic",
          userRole: document.getElementById('role').value
        }
      });
    }
  </script>
</head>
<body>
  <h2>Register for Our Service</h2>



  <form id="signup-form" onsubmit="trackSignup(); return false;">
    <label>Username: <input type="text" required></label><br>
    <label>Email: <input type="email" required></label><br>
    <label>Role:
      <select id="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </label><br>
    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
