<!DOCTYPE html>
<html>
<head>
  <title>Snowplow Flask Test</title>
  <script src="/static/sp.js"></script>
</head>
<body>
  <h1>Welcome to Flask App 1</h1>

  <!-- Tracking setup -->
  <script>
    window.snowplow('newTracker', 'sp', '{{ collector }}', {
      appId: '{{ app_id }}',
      platform: 'web',
      cookieDomain: null
    });

    // Track pageview
    window.snowplow('trackPageView');

    // Track structured event on button click
    function trackLoginClick() {
      window.snowplow('trackStructEvent', 'form', 'click', 'login_button', null, null);
    }
  </script>

  <!-- Simulated login form -->
  <form onsubmit="trackLoginClick(); return false;">
    <label>Email: <input type="email" required></label><br>
    <label>Password: <input type="password" required></label><br>
    <button type="submit">Login</button>
  </form>
</body>
</html>
